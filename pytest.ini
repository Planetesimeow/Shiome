[pytest]
testpaths = tests
# 把仓库根目录放进 sys.path，这样 `pytest` 和 `python -m pytest` 都能 import app.*。
# （`python -m pytest` 会自己把当前目录塞进 sys.path，裸跑 `pytest` 不会 —— 这个差别
#  曾经让本地全绿而 CI collection 就失败。）
pythonpath = .
markers =
    costs_money: 会真的调 Anthropic API 的测试（要 key、要花钱），默认不跑
addopts = -q --strict-markers
