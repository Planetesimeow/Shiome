name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 只跑不花钱的那部分。分析类端点会真的调 Anthropic API，
      # 它们既被 costs_money marker 排除，也被环境变量开关挡着 —— CI 永远不该花钱。
      - name: Run tests
        run: pytest -m "not costs_money"

      # 冒烟：应用真的能起来，而且鉴权是关着的。
      # 这一步同时盯住「没带凭据必须被拒」—— 一个能启动但谁都进得去的实例，
      # 比起不来更糟。
      - name: Check the app boots and refuses anonymous callers
        env:
          SHIOME_API_TOKEN: ci-boot-check-not-a-secret
        run: |
          python - <<'PY'
          import pathlib, tempfile
          from app import database
          database.DB_PATH = pathlib.Path(tempfile.mkdtemp()) / "boot.db"
          from fastapi.testclient import TestClient
          from app.main import app

          auth = {"Authorization": "Bearer ci-boot-check-not-a-secret"}
          with TestClient(app) as c:
              assert c.get("/api/accounts").status_code == 401, "无凭据必须被拒"
              assert c.get("/api/version").status_code == 200, "版本号是公开的"
              assert c.get("/", headers=auth).status_code == 200
              assert c.get("/api/accounts", headers=auth).status_code == 200
          print("boots clean, and closed to anonymous callers")
          PY

  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start disposable server and check phone flows
        env:
          SHIOME_BROWSER: ${{ matrix.browser }}
        run: |
          python -m tests.browser_server > /tmp/shiome-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/shiome-browser.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          npm run test:mobile

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the actual Compose deployment
        run: python -m tests.docker_smoke
