<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>潮目 Shiome · 账号设置</title>
<link rel="icon" href="/static/img/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .settings-shell { display: block; max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
  .settings-shell [hidden] { display: none; }
  .settings-shell h1 { font-size: 24px; margin-bottom: 10px; }
  .settings-shell h2 { font-size: 18px; margin-bottom: 16px; }
  .settings-shell a { color: var(--accent); }
  .settings-shell p { color: var(--text-muted); line-height: 1.7; }
  #model-status { overflow-wrap: anywhere; }
  .settings-card { background: var(--bg-elevated); border: 1px solid var(--border); padding: 24px; margin: 24px 0; border-radius: 6px; }
  .settings-card label { display: block; margin: 16px 0; font-size: 14px; }
  .settings-card input, .settings-card select { display: block; width: 100%; box-sizing: border-box; min-height: 44px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 10px; font: inherit; font-size: 16px; margin-top: 8px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; overflow-wrap: anywhere; }
  .settings-row button { min-height: 44px; }
  #settings-message { min-height: 24px; overflow-wrap: anywhere; }
  #invite-result { margin-top: 18px; }
  @media(max-width: 480px) { .settings-card { padding: 18px; } }
</style>
</head>
<body>
<header><a href="/" class="brand-wrap"><img class="brand-logo" src="/static/img/logo.png" alt="潮目 Shiome"></a><a class="btn-ghost" href="/">返回作品</a></header>
<main class="settings-shell">
  <h1>账号设置</h1>
  <p id="identity-label">正在加载...</p>
  <div id="settings-message" role="status" aria-live="polite"></div>
  <section class="settings-card">
    <h2>登录信息</h2>
    <p>修改密码后，其他设备需要重新登录。</p>
    <form id="credentials-form">
      <label>用户名<input id="settings-username" autocomplete="username" minlength="3" maxlength="32" autocapitalize="none" required></label>
      <label>当前密码<input type="password" id="current-password" autocomplete="current-password" maxlength="128" required></label>
      <label>新密码 · 至少 12 个字符<input type="password" id="new-password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
      <label>再次输入新密码<input type="password" id="new-password-confirm" autocomplete="new-password" minlength="12" maxlength="128" required></label>
      <button type="submit" class="primary">保存登录信息</button>
    </form>
  </section>
  <div id="admin-settings" hidden>
    <section class="settings-card">
      <h2>共享 AI 服务</h2>
      <p id="model-status"></p><p id="service-usage"></p>
      <p>所有受邀用户共用此密钥，调用费用由你承担。密钥保存后不会显示给任何用户。</p>
      <form id="key-form">
        <label>更新 Anthropic API 密钥<input type="password" id="shared-api-key" autocomplete="off" minlength="10" maxlength="512" required></label>
        <button type="submit" class="primary">验证并保存密钥</button>
      </form>
    </section>
    <section class="settings-card">
      <h2>邀请新用户</h2>
      <p>每个邀请只能注册一次。新用户会拥有独立的作品、分析和备份。</p>
      <form id="invite-form">
        <label>邀请有效期<select id="invite-days"><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select></label>
        <button type="submit" class="primary">创建邀请链接</button>
      </form>
      <div id="invite-result" hidden>
        <label>邀请链接 · 本次页面内可复制<input id="invite-link" readonly></label>
        <button type="button" class="btn-ghost" id="copy-invite">复制链接</button>
      </div>
      <div id="invitations-list"></div>
    </section>
    <section class="settings-card"><h2>用户管理</h2><p>停用后，该用户会立即失去访问权限，已有数据保留。</p><div id="users-list"></div></section>
  </div>
  <p><a href="/api/backup" download>下载我的数据备份</a></p>
  <button class="btn-ghost" id="settings-logout">退出登录</button>
</main>
<script src="/static/settings.js"></script>
</body>
</html>
