<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮目 Shiome · 登录</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: min(400px, calc(100vw - 40px));
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 40px 36px 32px;
    text-align: center;
  }
  .login-card img { width: 200px; height: auto; margin-bottom: 26px; }
  .login-card label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: left;
    margin-bottom: 8px;
  }
  .login-card input {
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card .primary { width: 100%; padding: 11px 16px; }
  .login-msg {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--danger);
    min-height: 16px;
    margin-top: 14px;
  }
  .login-foot {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 22px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<form class="login-card" id="login-form" autocomplete="on">
  <img src="/static/img/logo.png" alt="潮目 Shiome">
  <label for="password">口令</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
  <button type="submit" class="primary" id="submit">进入</button>
  <div class="login-msg" id="msg"></div>
  <div class="login-foot" id="foot">潮目 · <span id="ver">—</span></div>
</form>

<script>
const form = document.getElementById("login-form");
const msg = document.getElementById("msg");
const submit = document.getElementById("submit");

fetch("/api/version").then((r) => r.json())
  .then((d) => { document.getElementById("ver").textContent = "v" + d.version; })
  .catch(() => {});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = "";
  submit.disabled = true;
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (res.ok) {
      window.location.href = "/";
      return;
    }
    const body = await res.json().catch(() => ({}));
    msg.textContent = body.detail || "登录失败";
  } catch (err) {
    msg.textContent = "连不上服务端：" + err.message;
  }
  submit.disabled = false;
});
</script>
</body>
</html>
